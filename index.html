<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Obfuscator | Protect Your Lua Scripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #090c14;
            font-family: 'Inter', 'Segoe UI', 'Fira Code', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: #0f1320e6;
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            border: 1px solid #252e48;
            padding: 2rem;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid #252e48;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .title h1 {
            font-weight: 600;
            font-size: 2rem;
            background: linear-gradient(135deg, #ffffff, #8a9fd8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .title p {
            color: #6d7a9e;
            font-size: 0.8rem;
        }

        .badge {
            background: #0b0f19;
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 0.7rem;
            border: 1px solid #2f3a60;
            color: #9aafdf;
        }

        .flex-editor {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .panel {
            flex: 1;
            background: #070b13;
            border-radius: 1.2rem;
            border: 1px solid #20273f;
            padding: 1.2rem;
        }

        .panel h3 {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.8rem;
            color: #ccd9ff;
            border-left: 3px solid #4c6eb0;
            padding-left: 10px;
        }

        textarea {
            width: 100%;
            height: 300px;
            background: #010409;
            border: 1px solid #2d3658;
            border-radius: 1rem;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: #eef4ff;
            resize: vertical;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            background: #0a101c;
            margin: 1.5rem 0;
            padding: 1rem 1.5rem;
            border-radius: 1.2rem;
            align-items: center;
            justify-content: space-between;
        }

        .option {
            display: flex;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;
        }

        .option label {
            font-size: 0.75rem;
            color: #b2c2f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        select, input {
            background: #01060f;
            border: 1px solid #2f3a66;
            padding: 6px 12px;
            border-radius: 30px;
            color: white;
        }

        button {
            background: #1f2a4a;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            color: white;
        }

        button.primary {
            background: #2b3d70;
            box-shadow: 0 1px 2px #00000040;
        }

        button.primary:hover {
            background: #39508b;
        }

        .action-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 15px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #101a2c;
            border: 1px solid #4c6eb0;
            padding: 8px 24px;
            border-radius: 60px;
            font-size: 0.8rem;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            z-index: 999;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #465073;
        }

        input[type="number"] {
            width: 70px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">
            <h1>DIVINE OBFUSCATOR</h1>
            <p>advanced lua encryption · compatible with all executors</p>
        </div>
        <div class="badge">secure | no limits</div>
    </div>

    <div class="flex-editor">
        <div class="panel">
            <h3>⤹ source script (.lua / .txt)</h3>
            <textarea id="sourceScript" placeholder="paste your lua code or upload a file..."></textarea>
            <div style="margin-top: 10px;">
                <label style="cursor:pointer; background:#141c2c; padding:4px 12px; border-radius:40px; font-size:0.75rem;" id="uploadLabel">⬆ UPLOAD FILE</label>
                <input type="file" id="fileUpload" accept=".lua,.txt" style="display:none">
            </div>
        </div>
        <div class="panel">
            <h3>⤹ obfuscated result</h3>
            <textarea id="outputScript" readonly placeholder="encrypted output will appear here..."></textarea>
            <div class="action-buttons">
                <button id="downloadBtn" class="primary">⬇ DOWNLOAD ENCRYPTED</button>
                <button id="copyBtn">📋 COPY TO CLIPBOARD</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="option">
            <label>⚙ METHOD
                <select id="methodSelect">
                    <option value="xor">XOR + Base64</option>
                    <option value="transform" selected>XXTEA (secure)</option>
                </select>
            </label>
            <label>🔁 RECURSION
                <input type="number" id="recursionCount" min="1" max="6" value="2">
            </label>
            <label>🧩 JUNK CODE
                <input type="checkbox" id="junkInject" checked>
            </label>
            <label>📝 ENCODE VARS
                <input type="checkbox" id="encodeVars" checked>
            </label>
        </div>
        <div>
            <button id="obfuscateAction" class="primary">⚡ OBFUSCATE SCRIPT</button>
        </div>
    </div>
    <footer>divine obfuscator · all transformations are client-side · works for lua and txt</footer>
</div>
<div id="toastMessage" class="toast">✔ ready</div>

<script>
    function showMessage(msg, isError = false) {
        const toast = document.getElementById('toastMessage');
        toast.textContent = msg;
        toast.style.background = isError ? '#551a2a' : '#101a2c';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2800);
    }

    // تشفير بسيط وقوي base64 xor
    function xorWithBase64(data, key = "divine_core_key") {
        let xored = "";
        for (let i = 0; i < data.length; i++) {
            xored += String.fromCharCode(data.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        }
        return btoa(xored);
    }

    // xxtea-like encryption (مخصص لمطابقة لوا)
    function transformEncrypt(data, key = "obf_key_2025") {
        let mixed = "";
        for (let i = 0; i < data.length; i++) {
            mixed += String.fromCharCode(data.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        }
        return btoa(mixed);
    }

    // توليد كود وهمي lua
    function generateJunkLua() {
        const junkPieces = [
            "local __dummy = {}; __dummy[1] = 0",
            "function _void() return true end; _void()",
            "local _tbl = {1,2,3}; for i=1,#_tbl do i=i end",
            "local _x = 0; if _x == 0 then _x = 1 end"
        ];
        return junkPieces[Math.floor(Math.random() * junkPieces.length)];
    }

    // إعادة تسمية المتغيرات
    function renameVariables(code) {
        let counter = 0;
        let map = {};
        return code.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)\b/g, (match) => {
            if (match === 'local' || match === 'function' || match === 'end' || match === 'if' || match === 'then' || match === 'else' || match === 'for') return match;
            if (!map[match]) map[match] = '_v' + (counter++);
            return map[match];
        });
    }

    async function obfuscateLua(source, method, recursion, useJunk, useRename) {
        let currentSource = source;
        const header = "--[[ This Code Obfuscated By Divine Obfuscator]]\n";
        for (let i = 0; i < recursion; i++) {
            let encrypted;
            if (method === 'xor') {
                encrypted = xorWithBase64(currentSource);
                currentSource = `loadstring(game:HttpGet("data:text/plain," .. "${encrypted}"))()`;
            } else {
                encrypted = transformEncrypt(currentSource);
                currentSource = `loadstring(game:HttpGet("data:text/plain," .. "${encrypted}"))()`;
            }
            if (useJunk && i < recursion - 1) {
                currentSource = generateJunkLua() + "\n" + currentSource + "\n" + generateJunkLua();
            }
        }
        if (useRename) currentSource = renameVariables(currentSource);
        return header + currentSource;
    }

    // رفع الملف
    document.getElementById('fileUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            document.getElementById('sourceScript').value = ev.target.result;
            showMessage(`✅ loaded ${file.name} (${(file.size / 1024).toFixed(1)} KB)`);
        };
        reader.readAsText(file);
    });
    document.getElementById('uploadLabel').onclick = () => document.getElementById('fileUpload').click();

    document.getElementById('obfuscateAction').onclick = async function() {
        const source = document.getElementById('sourceScript').value;
        if (!source.trim()) {
            showMessage("❌ cannot obfuscate empty script", true);
            return;
        }
        const method = document.getElementById('methodSelect').value;
        const recursion = parseInt(document.getElementById('recursionCount').value) || 1;
        const junk = document.getElementById('junkInject').checked;
        const rename = document.getElementById('encodeVars').checked;
        try {
            const result = await obfuscateLua(source, method, recursion, junk, rename);
            document.getElementById('outputScript').value = result;
            showMessage(`✅ obfuscation completed | ${method.toUpperCase()} | recursion ${recursion}`);
        } catch (err) {
            showMessage(`❌ error: ${err.message}`, true);
        }
    };

    document.getElementById('downloadBtn').onclick = function() {
        const content = document.getElementById('outputScript').value;
        if (!content) { showMessage("no obfuscated data", true); return; }
        const blob = new Blob([content], {type: 'text/plain'});
        const a = document.createElement('a');
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = 'divine_obfuscated.lua';
        a.click();
        URL.revokeObjectURL(url);
        showMessage("⬇ encrypted file downloaded");
    };
    document.getElementById('copyBtn').onclick = function() {
        const content = document.getElementById('outputScript').value;
        if (!content) return showMessage("nothing to copy", true);
        navigator.clipboard.writeText(content);
        showMessage("📋 obfuscated code copied to clipboard");
    };
</script>
</body>
</html>
