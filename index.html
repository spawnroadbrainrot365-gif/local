<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع ملفات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0f1c;
            font-family: 'Segoe UI', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #111827;
            border-radius: 1.5rem;
            border: 1px solid #2a3a60;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }
        h1 { color: #b3d0ff; margin-bottom: 1rem; text-align: center; }
        .upload-area {
            background: #030712;
            border: 2px dashed #2d4379;
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        .upload-area:hover { border-color: #3b82f6; background: #0a0f1a; }
        button {
            background: #1f2a44;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }
        button.primary { background: #2563eb; width: 100%; }
        button.primary:hover { background: #3b82f6; }
        .result {
            background: #010409;
            border-radius: 1rem;
            padding: 1rem;
            margin-top: 1rem;
            display: none;
            word-break: break-all;
        }
        .result code { color: #9cdcfe; font-family: monospace; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            padding: 6px 18px;
            border-radius: 40px;
            color: white;
            opacity: 0;
            transition: 0.2s;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📁 رفع ملف</h1>
    <div class="upload-area" id="uploadArea">
        📂 اضغط لرفع ملف (أي حجم، أي امتداد)
        <input type="file" id="fileInput" style="display:none">
    </div>
    <div id="resultBox" class="result"></div>
    <button id="copyBtn" class="primary" style="display:none">📋 نسخ الرابط</button>
</div>
<div id="toast" class="toast">✅ تم النسخ</div>

<script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const resultBox = document.getElementById('resultBox');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');

    function showToast(msg) {
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2000);
    }

    uploadArea.onclick = () => fileInput.click();
    fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        try {
            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.success) {
                resultBox.innerHTML = `<code>✅ ${data.rawUrl}</code>`;
                resultBox.style.display = 'block';
                copyBtn.style.display = 'block';
                copyBtn.onclick = async () => {
                    await navigator.clipboard.writeText(data.rawUrl);
                    showToast('📋 تم نسخ الرابط');
                };
                showToast('✅ تم رفع الملف');
            } else {
                showToast('❌ فشل الرفع');
            }
        } catch (err) {
            showToast('❌ خطأ في الاتصال');
        }
    };
</script>
</body>
</html>
