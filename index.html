<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Protector - حماية سكربتاتك</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0f1c 0%, #0c1222 100%);
            font-family: 'Segoe UI', system-ui, monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        h1 { color: #b3d0ff; font-size: 2rem; margin-bottom: 10px; }
        .sub { color: #6b7c9e; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid #2a3560;
            padding-bottom: 10px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 25px;
            color: #8e9bb5;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #2563eb;
            color: white;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card {
            background: rgba(18, 25, 45, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            border: 1px solid #2a3a60;
            padding: 2rem;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        button {
            background: #1f2a44;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }
        button.primary { background: #2563eb; }
        button.primary:hover { background: #3b82f6; }
        button.danger { background: #dc2626; }
        button.success { background: #10b981; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-size: 0.9rem;
            opacity: 0;
            transition: 0.2s;
            z-index: 1000;
        }
        .file-list { max-height: 500px; overflow-y: auto; }
        .file-item {
            background: #0f1424;
            border-radius: 1rem;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .file-info { flex: 1; }
        .file-name { color: #9cdcfe; font-weight: bold; word-break: break-all; }
        .file-date { font-size: 0.7rem; color: #6b7c9e; }
        .file-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .badge {
            background: #2a3a66;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        .badge.secure { background: #10b981; }
        .badge.unsecure { background: #f59e0b; }
        .raw-box {
            background: #010409;
            border-radius: 1rem;
            padding: 12px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .raw-box code {
            font-family: monospace;
            font-size: 0.7rem;
            word-break: break-all;
            color: #9cdcfe;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            background: #010409;
            border: 1px solid #2a3a60;
            border-radius: 12px;
            color: white;
            font-family: monospace;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔒 Raw Protector</h1>
        <div class="sub">احمي سكربتاتك | يشتغل على Delta Executor وجميع المنصات</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="upload">📤 رفع ملف</button>
        <button class="tab-btn" data-tab="history">📜 History</button>
    </div>

    <div id="upload-tab" class="tab-content active">
        <div class="card">
            <div class="btn-group">
                <button id="uploadBtn" class="primary">📁 وضع ملف</button>
            </div>
            <input type="file" id="fileInput" style="display:none;">
            <div id="currentFileInfo" style="display:none;">
                <div class="raw-box">
                    <code id="rawUrlDisplay"></code>
                    <button id="copyRawDisplayBtn" class="success" style="padding: 6px 12px;">📋 نسخ</button>
                </div>
                <div class="btn-group" style="margin-top: 15px;">
                    <button id="secureFileBtn">🔒 تأمين الملف</button>
                </div>
            </div>
        </div>
    </div>

    <div id="history-tab" class="tab-content">
        <div class="card">
            <div class="file-list" id="fileList"></div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    let currentFile = null;

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.backgroundColor = isError ? '#dc2626' : '#1e293b';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 3000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function loadFiles() {
        const res = await fetch('/files');
        const files = await res.json();
        const container = document.getElementById('fileList');
        container.innerHTML = '';
        files.forEach(file => {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `
                <div class="file-info">
                    <div class="file-name">📄 ${escapeHtml(file.originalName)}</div>
                    <div class="file-date">📅 ${new Date(file.createdAt).toLocaleString()}</div>
                    <div><span class="badge ${file.secure ? 'secure' : 'unsecure'}">${file.secure ? '🔒 مؤمن' : '🔓 غير مؤمن'}</span></div>
                </div>
                <div class="file-actions">
                    <button onclick="copyRaw('${file.rawUrl}')" class="success" style="padding: 8px 16px;">📋 نسخ الرابط</button>
                    <button onclick="toggleSecure('${file.filename}', ${!file.secure})" class="primary" style="padding: 8px 16px;">${file.secure ? '🔓 فك التأمين' : '🔒 تأمين'}</button>
                    <button onclick="deleteFile('${file.filename}')" class="danger" style="padding: 8px 16px;">🗑️ حذف</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    async function copyRaw(url) {
        await navigator.clipboard.writeText(url);
        showToast('📋 تم نسخ رابط raw');
    }

    async function toggleSecure(filename, secure) {
        const url = secure ? `/secure/${filename}` : `/unsecure/${filename}`;
        const res = await fetch(url, { method: 'POST' });
        const data = await res.json();
        showToast(data.message);
        loadFiles();
        if (currentFile && currentFile.filename === filename) {
            const secureBtn = document.getElementById('secureFileBtn');
            if (secureBtn) secureBtn.textContent = secure ? '🔒 مؤمن' : '🔒 تأمين الملف';
        }
    }

    async function deleteFile(filename) {
        if (!confirm('هل أنت متأكد من حذف هذا الملف؟')) return;
        const res = await fetch(`/delete/${filename}`, { method: 'DELETE' });
        const data = await res.json();
        showToast(data.message);
        if (currentFile && currentFile.filename === filename) {
            document.getElementById('currentFileInfo').style.display = 'none';
            currentFile = null;
        }
        loadFiles();
    }

    document.getElementById('uploadBtn').addEventListener('click', () => {
        document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const formData = new FormData();
        formData.append('file', file);
        
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();
        
        if (data.success) {
            showToast(data.message);
            currentFile = { filename: data.filename, rawUrl: data.rawUrl, originalName: file.name };
            document.getElementById('rawUrlDisplay').textContent = data.rawUrl;
            document.getElementById('currentFileInfo').style.display = 'block';
            document.getElementById('secureFileBtn').textContent = '🔒 تأمين الملف';
            loadFiles();
        } else {
            showToast('❌ فشل رفع الملف', true);
        }
        e.target.value = '';
    });

    document.getElementById('copyRawDisplayBtn').addEventListener('click', async () => {
        if (currentFile) {
            await navigator.clipboard.writeText(currentFile.rawUrl);
            showToast('📋 تم نسخ رابط raw');
        }
    });

    document.getElementById('secureFileBtn').addEventListener('click', async () => {
        if (currentFile) {
            const res = await fetch(`/secure/${currentFile.filename}`, { method: 'POST' });
            const data = await res.json();
            showToast(data.message);
            document.getElementById('secureFileBtn').textContent = '🔒 مؤمن';
            loadFiles();
        }
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`${btn.dataset.tab}-tab`).classList.add('active');
            if (btn.dataset.tab === 'history') loadFiles();
        });
    });
</script>
</body>
</html>
