<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Protector Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0f1c 0%, #0c1222 100%);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        .header p { color: #8e9bb5; font-size: 1rem; }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 35px;
        }
        .tab-btn {
            background: rgba(30, 40, 60, 0.6);
            border: 1px solid rgba(100, 120, 160, 0.3);
            padding: 12px 32px;
            border-radius: 50px;
            color: #b0bedd;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            color: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }
        
        /* Cards */
        .card {
            background: rgba(18, 25, 45, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(100, 120, 160, 0.2);
            padding: 30px;
            margin-bottom: 25px;
        }
        
        /* Upload Area */
        .upload-area {
            background: rgba(10, 15, 30, 0.6);
            border: 2px dashed #3a4a70;
            border-radius: 24px;
            padding: 50px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }
        .upload-icon { font-size: 4rem; margin-bottom: 15px; }
        .upload-area h3 { color: #cbd5ff; margin-bottom: 8px; }
        .upload-area p { color: #6b7c9e; font-size: 0.85rem; }
        
        /* File Items */
        .file-list {
            max-height: 600px;
            overflow-y: auto;
        }
        .file-item {
            background: rgba(10, 15, 30, 0.6);
            border-radius: 20px;
            padding: 18px 22px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            transition: 0.2s;
        }
        .file-item:hover {
            background: rgba(102, 126, 234, 0.1);
            border-left: 3px solid #667eea;
        }
        .file-info {
            flex: 1;
            min-width: 200px;
        }
        .file-name {
            color: #a5b9ff;
            font-weight: 600;
            font-size: 1rem;
            word-break: break-all;
        }
        .file-date {
            color: #6b7c9e;
            font-size: 0.7rem;
            margin-top: 5px;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 8px;
        }
        .badge.secure { background: #10b981; color: white; }
        .badge.unsecure { background: #f59e0b; color: #1a1a2e; }
        
        .file-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            font-size: 0.85rem;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; transform: scale(0.98); }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #0ea271; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: transparent; border: 1px solid #4a5a80; color: #b0bedd; }
        .btn-outline:hover { background: rgba(100, 120, 160, 0.2); }
        
        /* Raw Box */
        .raw-box {
            background: #010409;
            border-radius: 16px;
            padding: 15px 20px;
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #2a3a60;
        }
        .raw-box code {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: #9cdcfe;
            word-break: break-all;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a253f;
            padding: 12px 28px;
            border-radius: 50px;
            color: white;
            font-size: 0.9rem;
            opacity: 0;
            transition: 0.2s;
            z-index: 1000;
            backdrop-filter: blur(8px);
            border: 1px solid #667eea;
        }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7c9e;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔒 Raw Protector Pro</h1>
        <p>احمي سكربتاتك من السرقة | يعمل على جميع منصات التشغيل</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="upload">📤 رفع ملف</button>
        <button class="tab-btn" data-tab="history">📜 الملفات</button>
    </div>

    <!-- Upload Tab -->
    <div id="upload-tab" class="tab-content active">
        <div class="card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <h3>اضغط لرفع ملف</h3>
                <p>جميع الامتدادات مدعومة | حجم غير محدود</p>
            </div>
            <input type="file" id="fileInput" style="display:none;">
            
            <div id="currentFileInfo" style="display:none;">
                <div class="raw-box">
                    <code id="rawUrlDisplay"></code>
                    <button id="copyRawBtn" class="btn btn-success">📋 نسخ</button>
                </div>
                <div style="margin-top: 20px; display: flex; gap: 12px;">
                    <button id="secureFileBtn" class="btn btn-primary">🔒 تأمين الملف</button>
                </div>
            </div>
        </div>
    </div>

    <!-- History Tab -->
    <div id="history-tab" class="tab-content">
        <div class="card">
            <div class="file-list" id="fileList">
                <div class="empty-state">📭 لا توجد ملفات مرفوعة</div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast">✅ تم</div>

<script>
    let currentFile = null;

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.backgroundColor = isError ? '#dc2626' : '#1a253f';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 3000);
    }

    async function loadFiles() {
        try {
            const res = await fetch('/files');
            const files = await res.json();
            const container = document.getElementById('fileList');
            
            if (files.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 لا توجد ملفات مرفوعة</div>';
                return;
            }
            
            container.innerHTML = '';
            for (const file of files) {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `
                    <div class="file-info">
                        <div class="file-name">📄 ${escapeHtml(file.originalName)}</div>
                        <div class="file-date">📅 ${new Date(file.createdAt).toLocaleString()}</div>
                        <div><span class="badge ${file.secure ? 'secure' : 'unsecure'}">${file.secure ? '🔒 مؤمن' : '🔓 غير مؤمن'}</span></div>
                    </div>
                    <div class="file-actions">
                        <button class="btn btn-outline" onclick="copyRaw('${file.rawUrl}')">📋 نسخ الرابط</button>
                        <button class="btn btn-primary" onclick="toggleSecure('${file.filename}', ${!file.secure})">${file.secure ? '🔓 فك التأمين' : '🔒 تأمين'}</button>
                        <button class="btn btn-danger" onclick="deleteFile('${file.filename}')">🗑️ حذف</button>
                    </div>
                `;
                container.appendChild(div);
            }
        } catch(e) {
            showToast('فشل تحميل الملفات', true);
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function copyRaw(url) {
        await navigator.clipboard.writeText(url);
        showToast('📋 تم نسخ رابط raw');
    }

    async function toggleSecure(filename, secure) {
        const url = secure ? `/secure/${filename}` : `/unsecure/${filename}`;
        const res = await fetch(url, { method: 'POST' });
        const data = await res.json();
        showToast(data.message);
        loadFiles();
        if (currentFile && currentFile.filename === filename) {
            const btn = document.getElementById('secureFileBtn');
            if (btn) btn.textContent = secure ? '🔒 مؤمن' : '🔒 تأمين الملف';
        }
    }

    async function deleteFile(filename) {
        if (!confirm('هل أنت متأكد من حذف هذا الملف؟')) return;
        const res = await fetch(`/delete/${filename}`, { method: 'DELETE' });
        const data = await res.json();
        showToast(data.message);
        if (currentFile && currentFile.filename === filename) {
            document.getElementById('currentFileInfo').style.display = 'none';
            currentFile = null;
        }
        loadFiles();
    }

    // Upload
    document.getElementById('uploadArea').addEventListener('click', () => {
        document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const formData = new FormData();
        formData.append('file', file);
        
        const btn = document.getElementById('uploadArea');
        btn.style.opacity = '0.5';
        
        try {
            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();
            
            if (data.success) {
                showToast(data.message);
                currentFile = { filename: data.filename, rawUrl: data.rawUrl, originalName: file.name };
                document.getElementById('rawUrlDisplay').textContent = data.rawUrl;
                document.getElementById('currentFileInfo').style.display = 'block';
                loadFiles();
            } else {
                showToast('❌ فشل رفع الملف', true);
            }
        } catch(e) {
            showToast('❌ خطأ في الاتصال', true);
        } finally {
            btn.style.opacity = '1';
            e.target.value = '';
        }
    });

    document.getElementById('copyRawBtn').addEventListener('click', async () => {
        if (currentFile) {
            await navigator.clipboard.writeText(currentFile.rawUrl);
            showToast('📋 تم نسخ رابط raw');
        }
    });

    document.getElementById('secureFileBtn').addEventListener('click', async () => {
        if (currentFile) {
            const res = await fetch(`/secure/${currentFile.filename}`, { method: 'POST' });
            const data = await res.json();
            showToast(data.message);
            document.getElementById('secureFileBtn').textContent = '🔒 مؤمن';
            loadFiles();
        }
    });

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            if (btn.dataset.tab === 'history') loadFiles();
            else document.getElementById(`${btn.dataset.tab}-tab`).classList.add('active');
        });
    });
</script>
</body>
</html>
