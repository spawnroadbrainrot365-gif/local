<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Obfuscator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0f1c 0%, #0c1222 50%, #0a0f1c 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', 'Inter', system-ui, monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #667eea, #764ba2, #667eea);
            background-size: 200% 200%;
            animation: gradient 3s ease infinite;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .header p {
            color: #8a9fd8;
            font-size: 0.9rem;
        }
        .tabs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .tab {
            background: rgba(30, 40, 60, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(100, 120, 160, 0.3);
            padding: 12px 32px;
            border-radius: 50px;
            color: #b0bedd;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            color: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }
        .card {
            background: rgba(18, 25, 45, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(100, 120, 160, 0.2);
            padding: 2rem;
        }
        .upload-area {
            background: rgba(10, 15, 30, 0.6);
            border: 2px dashed #3a4a70;
            border-radius: 24px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }
        button {
            background: #1f2a44;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        button.primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            width: 100%;
        }
        button.primary:hover {
            opacity: 0.9;
            transform: scale(0.98);
        }
        .result {
            background: #010409;
            border-radius: 16px;
            padding: 1rem;
            margin-top: 1rem;
            display: none;
            word-break: break-all;
        }
        .result code { color: #9cdcfe; font-family: monospace; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            padding: 8px 24px;
            border-radius: 40px;
            color: white;
            opacity: 0;
            transition: 0.2s;
            z-index: 1000;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }
        th, td {
            border: 1px solid #2a3a60;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #1f2a44;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        .badge.executor { background: #10b981; color: white; }
        .badge.browser { background: #f59e0b; color: #1a1a2e; }
        .badge.unknown { background: #6b7c9e; color: white; }
        .refresh {
            background: #2563eb;
            margin-bottom: 1rem;
            width: auto;
            padding: 6px 15px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Divine Obfuscator</h1>
        <p>حمايه سكربتاتك من الوصول اليها</p>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="upload">رفع ملفات</button>
        <button class="tab" data-tab="logs">لوق الي يحاولون يدخلون للملفات حقك</button>
    </div>

    <div id="upload-tab" class="tab-content active">
        <div class="card">
            <div class="upload-area" id="uploadArea">
                رفع ملف
                <input type="file" id="fileInput" style="display:none">
            </div>
            <div id="resultBox" class="result"></div>
            <button id="copyBtn" class="primary" style="display:none">نسخ رابط Raw</button>
        </div>
    </div>

    <div id="logs-tab" class="tab-content">
        <div class="card">
            <button class="refresh" onclick="fetchLogs()" refresh </button>
            <div style="overflow-x: auto;">
                <table id="logsTable">
                    <thead><tr><th>الوقت</th><th>الملف</th><th>IP</th><th>User-Agent</th><th>النوع</th></tr></thead>
                    <tbody id="logsBody"><tr><td colspan="5" style="text-align:center;">جاري التحميل...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div id="toast" class="toast"> تم النسخ</div>

<script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const resultBox = document.getElementById('resultBox');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');

    function showToast(msg) {
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2000);
    }

    uploadArea.onclick = () => fileInput.click();
    fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);
        try {
            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                resultBox.innerHTML = `<code>🔗 ${data.rawUrl}</code>`;
                resultBox.style.display = 'block';
                copyBtn.style.display = 'block';
                copyBtn.onclick = async () => {
                    await navigator.clipboard.writeText(data.rawUrl);
                    showToast(' تم نسخ الرابط المحمي');
                };
                showToast(' تم رفع الملف');
            } else showToast(' فشل الرفع');
        } catch(err) { showToast(' خطأ في الاتصال'); }
    };

    async function fetchLogs() {
        try {
            const res = await fetch('/api/logs');
            const logs = await res.json();
            const tbody = document.getElementById('logsBody');
            tbody.innerHTML = '';
            if (logs.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">لا توجد طلبات بعد</td></tr>'; return; }
            for (const log of logs) {
                const ua = log.userAgent || 'unknown';
                let type = 'unknown', typeClass = 'unknown';
                if (ua.includes('Roblox') || ua.includes('Delta') || ua.includes('Synapse') || ua.includes('Krnl') || ua.includes('Solara')) {
                    type = 'هاك'; typeClass = 'executor';
                } else if (ua.includes('Mozilla') || ua.includes('Chrome') || ua.includes('Safari') || ua.includes('Firefox') || ua.includes('Edge')) {
                    type = 'حد حاول يدخل على الرابط'; typeClass = 'browser';
                }
                tbody.innerHTML += `<tr><td style="white-space:nowrap;">${new Date(log.timestamp).toLocaleString()}</td><td><code>${log.filename}</code></td><td><code>${log.ip || 'unknown'}</code></td><td style="word-break:break-all;max-width:300px;" title="${ua}">${ua.substring(0, 70)}${ua.length>70?'...':''}</td><td><span class="badge ${typeClass}">${type}</span></td></tr>`;
            }
        } catch(e) { console.error(e); }
    }

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            tab.classList.add('active');
            const tabName = tab.getAttribute('data-tab');
            document.getElementById(`${tabName}-tab`).classList.add('active');
            if (tabName === 'logs') fetchLogs();
        });
    });

    fetchLogs();
    setInterval(fetchLogs, 6000);
</script>
</body>
</html>
