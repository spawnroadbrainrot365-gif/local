<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Obfuscator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0f1c 0%, #0c1222 50%, #0a0f1c 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', 'Inter', system-ui, monospace;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1300px; width: 100%; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #667eea, #764ba2, #667eea);
            background-size: 200% 200%;
            animation: gradient 3s ease infinite;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .header p { color: #8a9fd8; font-size: 0.9rem; }
        .tabs { display: flex; gap: 12px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .tab {
            background: rgba(30, 40, 60, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(100, 120, 160, 0.3);
            padding: 12px 32px;
            border-radius: 50px;
            color: #b0bedd;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            color: white;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }
        .card {
            background: rgba(18, 25, 45, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(100, 120, 160, 0.2);
            padding: 2rem;
        }
        .upload-area {
            background: rgba(10, 15, 30, 0.6);
            border: 2px dashed #3a4a70;
            border-radius: 24px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area:hover { border-color: #667eea; background: rgba(102, 126, 234, 0.1); }
        button {
            background: #1f2a44;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        button.primary { background: linear-gradient(135deg, #667eea, #764ba2); width: 100%; }
        button.primary:hover { opacity: 0.9; transform: scale(0.98); }
        button.small { background: #2563eb; padding: 6px 15px; font-size: 0.75rem; }
        button.small:hover { background: #3b82f6; }
        button.danger { background: #dc2626; }
        button.danger:hover { background: #ef4444; }
        .result { background: #010409; border-radius: 16px; padding: 1rem; margin-top: 1rem; display: none; word-break: break-all; }
        .result code { color: #9cdcfe; font-family: monospace; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            padding: 8px 24px;
            border-radius: 40px;
            color: white;
            opacity: 0;
            transition: 0.2s;
            z-index: 1000;
        }
        .files-list { display: flex; flex-direction: column; gap: 12px; }
        .file-item {
            background: rgba(10, 15, 30, 0.6);
            border-radius: 20px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid rgba(100, 120, 160, 0.2);
        }
        .file-item:hover { background: rgba(102, 126, 234, 0.1); border-color: rgba(102, 126, 234, 0.5); }
        .file-info { flex: 1; }
        .file-name { color: #9cdcfe; font-weight: 600; font-family: monospace; font-size: 0.9rem; }
        .file-date { font-size: 0.65rem; color: #6b7c9e; margin-top: 4px; }
        .file-actions { display: flex; gap: 8px; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #111827;
            border-radius: 1.5rem;
            border: 1px solid #2a3a60;
            max-width: 750px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 1.5rem;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #2a3a60;
        }
        .modal-header h3 { color: #b3d0ff; }
        .close-modal { background: #dc2626; padding: 5px 15px; border-radius: 30px; font-size: 0.8rem; }
        .log-entry {
            background: #0a0f1c;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #667eea;
        }
        .log-time { color: #8a9fd8; font-size: 0.7rem; }
        .log-detail { font-size: 0.8rem; margin-top: 5px; color: #b0bedd; }
        .log-country { font-size: 0.75rem; margin-top: 3px; color: #10b981; }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 5px;
        }
        .badge.executor { background: #10b981; color: white; }
        .badge.browser { background: #f59e0b; color: #1a1a2e; }
        .badge.unknown { background: #6b7c9e; color: white; }
        .empty-state { text-align: center; padding: 40px; color: #6b7c9e; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Divine Obfuscator</h1>
        <p>حماية سكربتاتك من الوصول إليها</p>
    </div>

    <div class="tabs">
        <button class="tab" data-tab="upload"> رفع ملف</button>
        <button class="tab active" data-tab="files"> ملفاتي</button>
    </div>

    <div id="upload-tab" class="tab-content">
        <div class="card">
            <div class="upload-area" id="uploadArea">
                 اضغط لرفع ملف
                <input type="file" id="fileInput" style="display:none">
            </div>
            <div id="resultBox" class="result"></div>
            <button id="copyBtn" class="primary" style="display:none"> نسخ رابط Raw</button>
        </div>
    </div>

    <div id="files-tab" class="tab-content active">
        <div class="card">
            <div id="filesList" class="files-list">
                <div class="empty-state"> جاري تحميل ملفاتك...</div>
            </div>
        </div>
    </div>
</div>

<div id="logsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle"> تفاصيل الملف</h3>
            <button class="close-modal" onclick="closeModal()">✕ إغلاق</button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<div id="toast" class="toast"> تم النسخ</div>

<script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const resultBox = document.getElementById('resultBox');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');
    let allLogs = [];
    let currentModalFile = null;

    function showToast(msg) {
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2000);
    }

    // رفع الملف
    uploadArea.onclick = () => fileInput.click();
    fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);
        try {
            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                resultBox.innerHTML = `<code>🔗 ${data.rawUrl}</code>`;
                resultBox.style.display = 'block';
                copyBtn.style.display = 'block';
                copyBtn.onclick = async () => {
                    await navigator.clipboard.writeText(data.rawUrl);
                    showToast(' تم نسخ الرابط المحمي');
                };
                showToast(' تم رفع الملف');
                fetchFiles();
            } else showToast(' فشل الرفع');
        } catch(err) { showToast(' خطأ في الاتصال'); }
    };

    // جلب الملفات واللوقات
    async function fetchFiles() {
        try {
            const res = await fetch('/api/logs');
            allLogs = await res.json();
            const filesMap = new Map();
            
            for (const log of allLogs) {
                if (!filesMap.has(log.filename)) {
                    filesMap.set(log.filename, { filename: log.filename, firstSeen: log.timestamp });
                }
            }
            
            const files = Array.from(filesMap.keys()).map(filename => ({
                filename: filename,
                firstSeen: filesMap.get(filename).firstSeen,
                logs: allLogs.filter(l => l.filename === filename)
            }));
            
            files.sort((a, b) => new Date(b.firstSeen) - new Date(a.firstSeen));
            renderFiles(files);
        } catch(e) { console.error(e); }
    }

    function renderFiles(files) {
        const container = document.getElementById('filesList');
        if (files.length === 0) {
            container.innerHTML = '<div class="empty-state"> لا توجد ملفات مرفوعة بعد</div>';
            return;
        }
        
        container.innerHTML = '';
        for (const file of files) {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `
                <div class="file-info">
                    <div class="file-name"> ${escapeHtml(file.filename)}</div>
                    <div class="file-date"> أول رفع: ${new Date(file.firstSeen).toLocaleString()}</div>
                    <div class="file-date"> عدد الطلبات: ${file.logs.length}</div>
                </div>
                <div class="file-actions">
                    <button class="small" onclick="showFileDetails('${escapeHtml(file.filename)}')"> تفاصيل</button>
                </div>
            `;
            container.appendChild(div);
        }
    }

    // جلب الدولة من IP
    async function getCountry(ip) {
        try {
            const res = await fetch(`https://ipapi.co/${ip}/country_name/`);
            const country = await res.text();
            return country && country !== 'undefined' ? country : 'غير معروف';
        } catch(e) { return 'غير معروف'; }
    }

    async function showFileDetails(filename) {
        const modal = document.getElementById('logsModal');
        const modalBody = document.getElementById('modalBody');
        const modalTitle = document.getElementById('modalTitle');
        
        modalTitle.textContent = ` تفاصيل الملف: ${filename}`;
        modalBody.innerHTML = '<div style="text-align:center; padding:20px;">جاري تحميل التفاصيل...</div>';
        modal.style.display = 'flex';
        
        const fileLogs = allLogs.filter(l => l.filename === filename);
        fileLogs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        
        let html = '';
        for (const log of fileLogs) {
            const ua = log.userAgent || 'unknown';
            let type = ' غير معروف';
            let typeClass = 'unknown';
            
            if (ua.includes('Roblox') || ua.includes('Delta') || ua.includes('Synapse') || ua.includes('Krnl') || ua.includes('Solara')) {
                type = ' هاك';
                typeClass = 'executor';
            } else if (ua.includes('Mozilla') || ua.includes('Chrome') || ua.includes('Safari') || ua.includes('Firefox') || ua.includes('Edge')) {
                type = 'الاشخاص الي حاولو يشوفون سكربتك(بس مايقدرون)';
                typeClass = 'browser';
            }
            
            const country = await getCountry(log.ip || 'unknown');
            
            html += `
                <div class="log-entry">
                    <div class="log-time"> ${new Date(log.timestamp).toLocaleString()}</div>
                    <div class="log-detail"> IP: <code>${log.ip || 'unknown'}</code> <span class="badge ${typeClass}">${type}</span></div>
                    <div class="log-country"> الدولة: ${country}</div>
                    <div class="log-detail"> User-Agent: <span style="font-size:0.7rem; word-break:break-all;">${escapeHtml(ua)}</span></div>
                </div>
            `;
        }
        
        if (fileLogs.length === 0) {
            html = '<div class="empty-state"> لا توجد طلبات على هذا الملف بعد</div>';
        }
        
        modalBody.innerHTML = html;
    }

    function closeModal() {
        document.getElementById('logsModal').style.display = 'none';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // التبويبات
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            tab.classList.add('active');
            const tabName = tab.getAttribute('data-tab');
            document.getElementById(`${tabName}-tab`).classList.add('active');
            if (tabName === 'files') fetchFiles();
        });
    });

    fetchFiles();
    setInterval(fetchFiles, 10000);
</script>
</body>
</html>
