<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Protector Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0f1c 0%, #0c1222 100%);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header p { color: #8e9bb5; }
        .card {
            background: rgba(18, 25, 45, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(100, 120, 160, 0.2);
            padding: 30px;
            margin-bottom: 25px;
        }
        .upload-area {
            background: rgba(10, 15, 30, 0.6);
            border: 2px dashed #3a4a70;
            border-radius: 24px;
            padding: 50px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area:hover { border-color: #667eea; background: rgba(102, 126, 234, 0.1); }
        .upload-icon { font-size: 4rem; margin-bottom: 15px; }
        .btn {
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 0.85rem;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-outline { background: transparent; border: 1px solid #4a5a80; color: #b0bedd; }
        .raw-box {
            background: #010409;
            border-radius: 16px;
            padding: 15px 20px;
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .raw-box code {
            font-family: monospace;
            font-size: 0.75rem;
            color: #9cdcfe;
            word-break: break-all;
        }
        .file-list { max-height: 500px; overflow-y: auto; }
        .file-item {
            background: rgba(10, 15, 30, 0.6);
            border-radius: 16px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .file-name { color: #a5b9ff; font-weight: 600; }
        .file-date { font-size: 0.7rem; color: #6b7c9e; margin-top: 5px; }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 5px;
        }
        .badge.secure { background: #10b981; color: white; }
        .badge.unsecure { background: #f59e0b; color: #1a1a2e; }
        .file-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a253f;
            padding: 10px 24px;
            border-radius: 50px;
            color: white;
            font-size: 0.9rem;
            opacity: 0;
            transition: 0.2s;
            z-index: 1000;
        }
        .tabs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .tab-btn {
            background: rgba(30, 40, 60, 0.6);
            border: none;
            padding: 10px 30px;
            border-radius: 50px;
            color: #b0bedd;
            font-weight: 600;
            cursor: pointer;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .empty-state { text-align: center; padding: 40px; color: #6b7c9e; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔒 Raw Protector Pro</h1>
        <p>احمي سكربتاتك من السرقة | يعمل على Delta Executor</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="upload">📤 رفع ملف</button>
        <button class="tab-btn" data-tab="history">📜 ملفاتي</button>
    </div>

    <div id="upload-tab" class="tab-content active">
        <div class="card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <h3>اضغط لرفع ملف</h3>
                <p>جميع الامتدادات مدعومة</p>
            </div>
            <input type="file" id="fileInput" style="display:none;">
            <div id="currentFileInfo" style="display:none;">
                <div class="raw-box">
                    <code id="rawUrlDisplay"></code>
                    <button id="copyRawBtn" class="btn btn-success">📋 نسخ</button>
                </div>
                <div style="margin-top: 15px;">
                    <button id="secureFileBtn" class="btn btn-primary">🔒 تأمين الملف</button>
                </div>
            </div>
        </div>
    </div>

    <div id="history-tab" class="tab-content">
        <div class="card">
            <div class="file-list" id="fileList">
                <div class="empty-state">📭 لا توجد ملفات</div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast">✅ تم</div>

<script>
    let currentFile = null;

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.backgroundColor = isError ? '#dc2626' : '#1a253f';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2500);
    }

    async function loadFiles() {
        try {
            const res = await fetch('/files');
            const files = await res.json();
            const container = document.getElementById('fileList');
            if (files.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 لا توجد ملفات</div>';
                return;
            }
            container.innerHTML = '';
            for (const f of files) {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `
                    <div style="flex:1">
                        <div class="file-name">📄 ${escapeHtml(f.originalName)}</div>
                        <div class="file-date">📅 ${new Date(f.createdAt).toLocaleString()}</div>
                        <div><span class="badge ${f.secure ? 'secure' : 'unsecure'}">${f.secure ? '🔒 مؤمن' : '🔓 غير مؤمن'}</span></div>
                    </div>
                    <div class="file-actions">
                        <button class="btn btn-outline" onclick="copyRaw('${f.rawUrl}')">📋 نسخ الرابط</button>
                        <button class="btn btn-primary" onclick="toggleSecure('${f.filename}', ${!f.secure})">${f.secure ? '🔓 فك التأمين' : '🔒 تأمين'}</button>
                        <button class="btn btn-danger" onclick="deleteFile('${f.filename}')">🗑️ حذف</button>
                    </div>
                `;
                container.appendChild(div);
            }
        } catch(e) { showToast('خطأ في التحميل', true); }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    async function copyRaw(url) {
        await navigator.clipboard.writeText(url);
        showToast('📋 تم نسخ رابط raw');
    }

    async function toggleSecure(filename, secure) {
        const url = secure ? `/secure/${filename}` : `/unsecure/${filename}`;
        const res = await fetch(url, { method: 'POST' });
        const data = await res.json();
        showToast(data.message);
        loadFiles();
    }

    async function deleteFile(filename) {
        if (!confirm('حذف الملف؟')) return;
        const res = await fetch(`/delete/${filename}`, { method: 'DELETE' });
        const data = await res.json();
        showToast(data.message);
        if (currentFile && currentFile.filename === filename) {
            document.getElementById('currentFileInfo').style.display = 'none';
            currentFile = null;
        }
        loadFiles();
    }

    document.getElementById('uploadArea').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);
        try {
            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                showToast(data.message);
                currentFile = { filename: data.filename, rawUrl: data.rawUrl };
                document.getElementById('rawUrlDisplay').innerHTML = data.rawUrl;
                document.getElementById('currentFileInfo').style.display = 'block';
                loadFiles();
            } else showToast('❌ فشل الرفع', true);
        } catch(e) { showToast('❌ خطأ في الاتصال', true); }
        e.target.value = '';
    };

    document.getElementById('copyRawBtn').onclick = async () => {
        if (currentFile) {
            await navigator.clipboard.writeText(currentFile.rawUrl);
            showToast('📋 تم نسخ الرابط');
        }
    };

    document.getElementById('secureFileBtn').onclick = async () => {
        if (currentFile) {
            const res = await fetch(`/secure/${currentFile.filename}`, { method: 'POST' });
            const data = await res.json();
            showToast(data.message);
            document.getElementById('secureFileBtn').textContent = '🔒 مؤمن';
            loadFiles();
        }
    };

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`${btn.dataset.tab}-tab`).classList.add('active');
            if (btn.dataset.tab === 'history') loadFiles();
        };
    });
</script>
</body>
</html>
